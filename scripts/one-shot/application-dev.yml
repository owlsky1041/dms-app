# ============================================================
# DMS 后端 application-dev.yml（Debian 13.5 部署配置）
# ============================================================
# 上传位置：/opt/dms/application-dev.yml
# 用法：--spring.config.location=/opt/dms/application-dev.yml
# ============================================================

spring:
  application:
    name: dms
  profiles:
    active: dev

  # ============== 数据源（PostgreSQL） ==============
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/dms?useUnicode=true&characterEncoding=utf8
    username: dms
    password: dms_password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: dms-pool

  # ============== Redis ==============
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000

  # ============== 文件上传（tus） ==============
  servlet:
    multipart:
      enabled: false   # tus 接管上传，禁用 Spring 默认 multipart
      max-file-size: -1
      max-request-size: -1

  # ============== Flyway ==============
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  # ============== Jackson ==============
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============== DMS 业务配置 ==============
dms:
  # tus 断点续传
  tus:
    upload-uri: /api/upload/tus
    temp-dir: /opt/dms/tus
  # 单次上传限制
  upload:
    max-size: 10737418240   # 10GB

  # MinIO
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: dms-files
    region: ""

  # LibreOffice
  jodconverter:
    local:
      enabled: true
      office-home: /usr/lib/libreoffice
      port-numbers: 8100,8101
      max-tasks-per-process: 100

# ============== 日志 ==============
logging:
  level:
    root: INFO
    org.dromara.dms: DEBUG
    org.dromara: INFO
    com.baomidou.mybatisplus: WARN
  file:
    name: /opt/dms/logs/dms.log
    max-size: 100MB
    max-history: 30

# ============== 服务端口 ==============
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 8h

# ============== Sa-Token ==============
sa-token:
  token-name: Authorization
  timeout: 28800        # 8 小时
  active-timeout: 1800  # 30 分钟无操作失效
  is-concurrent: true
  is-share: true
  is-logger: false
  is-read-cookie: false
  is-read-header: true
