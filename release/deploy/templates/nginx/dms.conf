# =============================================================================
# DMS 站点配置（nginx）
#
# 装到 /etc/nginx/sites-available/dms 并软链到 sites-enabled/dms。
# 只保留**一个** sites-enabled 文件：nginx 的 include 是 sites-enabled/*，
# 目录里放 .bak 备份也会被一起加载，出现 conflicting server name 警告，
# 谁生效取决于文件名字典序 —— 这种"看起来没事"的配置最坑人。
# =============================================================================
server {
    listen 80;
    server_name _;

    root /opt/dms/dist;

    # ---- 传输优化 ----
    # 系统默认只对 text/html 压缩；前端最大的 chunk 有 1.1MB，必须显式开启类型
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/wasm image/svg+xml;

    index index.html;

    # index.html 永不缓存（SPA 入口，确保拿到最新 JS 引用）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.worker\.min\.(js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        expires 30d;
    }

    # ===== OnlyOffice Document Server（同源反代） =====
    # 说明：OnlyOffice 的 JS 与资源使用根路径绝对地址，且浏览器只能访问本机 80 端口
    # （8380 -> 80 由网关转发，8081 未对外），因此必须在同一源下反代。
    # 该正则必须排在下方后端反代正则之前：/doc/ 是 OnlyOffice 的协作会话端点，
    # 若被后端正则（含 doc 前缀）抢先匹配就会 404。
    # 兼容两种形态：
    #   1) 根路径资源            /web-apps/... /sdkjs/... 等
    #   2) 带版本号前缀的资源    /9.4.0-<hash>/web-apps/...
    #      OnlyOffice 会把编辑器页面 302 跳到带版本号前缀的地址；
    #      若不覆盖，这些请求会落到下方 SPA 的 try_files -> index.html，
    #      于是在预览 iframe 里渲染出整个 DMS 应用（曾出现的问题）。
    # ⚠️ 这个路径清单必须覆盖"编辑器客户端会直接请求的全部文档服务端点"，
    #    漏一个就会出现"编辑器界面出来了、但文档打开失败"这种极难查的现象：
    #    漏掉 downloadfile 时，POST /downloadfile/<key> 落到下面的 SPA 规则，
    #    静态文件不接受 POST → 405；文档服务器因此没能把文档放进缓存，
    #    编辑器再取 /cache/files/... 就是 403，界面上弹「错误 / 下载失败」。
    #    清单来源（别靠猜）：容器内 `grep -hE "location" /etc/nginx/includes/ds-*.conf`
    #    再加上 `grep -rhoE "/(downloadfile|readfile|uploadfile|savefile|upload|converter)" \
    #      /var/www/onlyoffice/documentserver/{web-apps,sdkjs}` 得到的客户端调用路径。
    location ~ ^/(?:\d+\.\d+\.\d+[-.][\w]+/|(?:web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries|cache|doc|internal|meta|welcome|info|healthcheck|coauthoring|downloadas|downloadfile|readfile|uploadfile|savefile|upload|converter|hosting|ai-proxy|ConvertService\.ashx|GetLicense|docbuilder|spellchecker|document_editor_service_worker\.js)/?) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        # OnlyOffice 用 X-Forwarded-Host 拼 302 跳转地址；必须带端口，
        # 否则会跳到 80 端口（网关未转发）导致编辑器加载失败
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
    }

    # 后端反代（RuoYi 无 /api 前缀 + doc 带 /api）
    location ~ ^/(auth|system|resource|monitor|tool|oss|message|doc|api|upload|captcha|snail|warm|mcp|login-info|online)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/dms-access.log;
    error_log /var/log/nginx/dms-error.log;
}

