# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # jetty 配置
  jetty:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-form-post-size: -1
    threads:
      # 最小线程数
      min: 8
      # 最大线程数
      max: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config
    - /snail-chat/**
    - /api/snail/chat/**
    # 站点配置：登录页需要在未登录状态读取站点名称/备案/版权与图标
    - /api/site/config
    - /api/site/favicon
    - /api/site/logo
    # 用户自助注册 / 邮箱验证码找回密码：此时用户尚未登录，必须允许匿名访问
    # 安全性由业务层保证（注册开关、验证码 5 分钟有效、同账号 60 秒限发一次、连错 5 次作废）
    - /api/site/register
    - /api/site/password/code
    - /api/site/password/reset
    # OnlyOffice 取文档：由服务端直接拉取，无法携带登录态，改用短期 HMAC 令牌校验
    - /api/onlyoffice/file/**
    # 图片/视频直链：<img src> / <video src> 带不上 Authorization 头，
    # 同样改用短期 HMAC 令牌，控制器里每次访问都重新校验预览权限
    - /api/doc/media/**

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDvEDuRIOM3oZPWj9Ukoc5pQklR4PFH6/clnjeFqjDLIgDyQvjxhgqAZQA+E9eD6qu6FsXPmK8djcL+nh3cFHz4pX473jDvO3Sve+8yL3VRQ0n2pRgQ2a01MJsy+WwTZCBYWf0VnLRIvANUoWQgy9vz94q7Va44dg7A1/3ICf+xAwIDAQAB
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus后台管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.演示模块
      packages-to-scan: org.dromara.demo
    - group: 2.通用模块
      packages-to-scan: org.dromara.web
    - group: 3.系统模块
      packages-to-scan: org.dromara.system
    - group: 4.代码生成模块
      packages-to-scan: org.dromara.gen
    - group: 5.工作流模块
      packages-to-scan: org.dromara.workflow

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice
    - /warm-flow/save-json

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 统一消息推送配置
message:
  enabled: true
  # sse / websocket
  transport: sse
  # 统一访问路径
  path: /resource/message
  # websocket 允许的跨域来源
  allowedOrigins: '*'
  # SSE 连接超时时间，单位毫秒
  sse-timeout: 86400000
  # 本地连接心跳检测间隔，单位秒
  heartbeat-interval: 60
  # WebSocket 单次发送超时时间，单位毫秒
  web-socket-send-time-limit: 10000
  # WebSocket 发送缓冲区大小
  web-socket-buffer-size-limit: 64000

--- # warm-flow工作流配置
warm-flow:
  # 是否开启工作流，默认true
  enabled: true
  # 是否开启设计器ui
  ui: true
  # 是否显示流程图顶部文字
  top-text-show: true
  # 是否渲染节点悬浮提示，默认true
  node-tooltip: true
  # 默认Authorization，如果有多个token，用逗号分隔
  token-name: ${sa-token.token-name},clientid

--- # LiteFlow 业务规则编排
liteflow:
  # 跟随工作流模块开关，避免禁用工作流时仍加载任务办理链
  enable: ${warm-flow.enabled:true}
  # 工作流模块用于编排任务办理链路
  rule-source: classpath:liteflow/*.el.xml
  # 开启虚拟线程
  enable-virtual-thread: true

--- # mqtt 配置
# 具体配置还需查看文档
# https://mica-mqtt.dreamlu.net/guide/spring/client.html
mqtt.client:
  # 是否开启客户端，默认：true
  enabled: false
  # 连接的服务端 ip ，默认：127.0.0.1
  ip: 127.0.0.1
  # 端口：默认：1883
  port: 1883
  # 客户端名称
  name: Mqtt-Client
  # 客户端Id（非常重要，一般为设备 sn，不可重复）
  client-id: 000001
  username: ruoyi
  password: 123456
  # 超时时间，单位：秒，默认：5秒
  timeout: 5
  # 重连时间，默认 5000 毫秒
  re-interval: 5000
  # mqtt 协议版本，可选 MQTT_3_1、mqtt_3_1_1、mqtt_5，默认：mqtt_5
  version: mqtt_5
  # 接收数据的 buffer size，默认：8k
  read-buffer-size: 8KB
  # 消息解析最大 bytes 长度，默认：10M
  max-bytes-in-message: 10MB
  # keep-alive 时间，单位：秒
  keep-alive-secs: 60
  # 开启保留 session 时，session 的有效期
  session-expiry-interval-secs: 0
  # 工作线程数，如果消息量比较大，例如做 emqx 的转发消息处理，可以调大此参数
  mqtt-executor-size: 2
  # 是否开启 ssl
  ssl:
    enabled: false
    keystore-path:
    keystore-pass:
    truststore-path:
    truststore-pass:

--- # elasticsearch 功能配置
# 文档地址: https://www.easy-es.cn/
# 更改包名需要去 EasyEsConfiguration 修改包扫描(后续版本支持配置文件读取)
easy-es:
  # 是否开启EE自动配置
  enable: false
  # 兼容模式
  compatible: true
  # es连接地址+端口 格式必须为ip:port,如果是集群则可用逗号隔开
  address: localhost:9200
  # 默认为http
  schema: http
  # 注意ES建议使用账号认证 不使用会报警告日志
  # 如果无账号密码则可不配置此行
  # username:
  # 如果无账号密码则可不配置此行
  # password:
  # 心跳策略时间 单位:ms
  keep-alive-millis: 18000
  # 连接超时时间 单位:ms
  connectTimeout: 5000
  # 通信超时时间 单位:ms
  socketTimeout: 5000
  # 连接请求超时时间 单位:ms
  connectionRequestTimeout: 5000
  # 最大连接数 单位:个
  maxConnTotal: 100
  # 最大连接路由数 单位:个
  maxConnPerRoute: 100
  global-config:
    # 开启控制台打印通过本框架生成的DSL语句,默认为开启,测试稳定后的生产环境建议关闭,以提升少量性能
    print-dsl: true
    # 异步处理索引是否阻塞主线程 默认阻塞 数据量过大时调整为非阻塞异步进行 项目启动更快
    asyncProcessIndexBlocking: true
    db-config:
      # 是否开启下划线转驼峰 默认为false
      map-underscore-to-camel-case: true
      # id生成策略 customize为自定义,id值由用户生成,比如取MySQL中的数据id,如缺省此项配置,则id默认策略为es自动生成
      id-type: customize
      # 字段更新策略 默认为not_null
      field-strategy: not_null
      # 默认开启,查询若指定了size超过1w条时也会自动开启,开启后查询所有匹配数据,若不开启,会导致无法获取数据总条数,其它功能不受影响.
      enable-track-total-hits: true
      # 数据刷新策略,默认为不刷新
      refresh-policy: immediate

--- # MCP 服务端配置
spring.ai.mcp:
  server:
    # 与 ruoyi-admin 共用端口，默认端点为 /mcp
    enabled: true
    protocol: STREAMABLE
    name: ${spring.application.name}
    version: ${project.version}
    type: SYNC
    annotation-scanner:
      enabled: true
    streamable-http:
      mcp-endpoint: /mcp

--- # MCP 客户端配置
spring.ai.mcp:
  client:
    # 需要接入外部 MCP Server 时再打开，并配置 streamable-http/stdio connections
    enabled: false
    name: ${spring.application.name}-mcp-client
    version: ${project.version}
    type: SYNC
    toolcallback:
      enabled: false
    # Streamable HTTP 多服务端示例
    streamable-http:
      connections:
        knowledge:
          url: http://localhost:9001
        crm:
          url: http://localhost:9002
    # STDIO 多服务端示例
    stdio:
      connections:
        filesystem:
          command: npx
          args:
            - -y
            - '@modelcontextprotocol/server-filesystem'
            - D:/data

# DMS 站点资源（站点图标等）
dms:
  site:
    asset-dir: /opt/dms/site-assets
  # OnlyOffice 文档服务
  onlyoffice:
    # 浏览器访问文档服务的地址（默认本机：部署时由外部配置按实际情况覆盖）
    url: http://127.0.0.1:8081
    # 文档服务反向拉取本站文档用的地址（容器访问宿主机，需填宿主机可达地址；
    # 生产部署在 /opt/dms/config/application-prod.yml 里按本机地址设置）
    document-base-url: http://127.0.0.1
    # 文档服务内部调用地址（后端 -> 文档服务，用于读取支持格式等）
    internal-url: http://127.0.0.1:8081
    # 临时下载令牌签名密钥
    secret: dms-onlyoffice-2026
  # 音视频处理（海报图 / 时长 / 非浏览器友好格式转 mp4 预览版）
  video:
    # ffmpeg / ffprobe 可执行文件（Debian 13: apt install ffmpeg）
    ffmpeg-bin: ffmpeg
    ffprobe-bin: ffprobe
    # 预览版目标码率上限（kbps），控制转码产物体积
    preview-bitrate-kbps: 1500
    # 单次转码最长等待时间（秒）；超时放弃预览版，不影响原文件下载
    transcode-timeout-seconds: 1800
    # 超过该大小（MB）不做转码，避免超大视频长时间占用 CPU
    max-transcode-size-mb: 2048
  # 下载
  download:
    # 打包下载（流式 ZIP）
    zip:
      # 单次最多打包的文件数；超出时提示分批下载
      max-files: 2000
      # 单次最大未压缩字节数，默认 4GB。
      # 刻意压在 4GB 以内：超过会触发 ZIP64 扩展，旧解压工具可能不支持
      max-bytes: 4294967296
      # 超过下列任一阈值时，前端改为提交「异步导出任务」（有进度、不受长连接时长限制）
      async-threshold-bytes: 1073741824    # 1GB
      async-threshold-files: 500
      # 异步导出的 ZIP 落盘目录（一次性中间产物，过期由定时任务清理）
      async-dir: /opt/dms/export
      # 成品保留小时数
      async-retention-hours: 24
      # 同时打包的任务数上限
      async-concurrency: 2
      # 单用户同时进行中的任务数上限
      async-max-active-per-user: 2
      # 待执行任务的扫描间隔
      async-poll-ms: 3000
      # RUNNING 超过该分钟数视为卡死，重新排队（应对应用重启）
      async-stale-minutes: 30
      async-recover-cron: "0 */10 * * * ?"
      async-cleanup-cron: "0 15 * * * ?"
  # 业务审计
  audit:
    # 是否记录「预览」。
    # 预览是高频动作，全记会让审计表迅速膨胀；默认关闭，
    # 需要追溯"谁看过哪些文件"时再打开。
    record-preview: false
  # 回收站
  recycle:
    # 保留天数：超过则被定时任务物理清理（0 或负数 = 不自动清理）
    retention-days: 7
    # 自动清理任务的 cron（默认每天凌晨 3:30）
    cleanup-cron: "0 30 3 * * ?"
